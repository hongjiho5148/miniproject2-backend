# ==========================================
# 로컬 MariaDB 접속 설정
# 실제 비밀번호/시크릿 값은 git에 올라가지 않는 config/application-secrets-dev.properties
# 파일(각자 로컬에 생성, config/application-secrets-dev.properties.example 참고)에서 주입됩니다.
# ==========================================
spring.config.import=optional:file:./config/application-secrets-dev.properties
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/mate_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=mate_app
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# JPA 및 Hibernate 설정
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ==========================================
# DB 초기화 스크립트 (data.sql) 설정
# ==========================================
# 💡 always에서 never로 변경! (이제 서버를 켜도 data.sql이 중복 실행되지 않습니다)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ==========================================
# 로깅 설정
# ==========================================
logging.level.com.rookies5.Backend_MATE=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level [%logger{36}:%line] - %msg%n

# ==========================================
# Flyway 비활성화 (JPA와 data.sql만 사용하기 위함)
# ==========================================
spring.flyway.enabled=false

# ========================================================
# JWT 암호화에 사용할 시크릿 키 (최소 256비트 이상의 무작위 문자열)
# ========================================================
jwt.secret=${JWT_SECRET}

# 파일 하나당 최대 크기 (기본 1MB -> 5MB로 증설)
spring.servlet.multipart.max-file-size=5MB

# 한 번의 요청(파일+데이터)에 담긴 전체 크기
spring.servlet.multipart.max-request-size=5MB

# Cloudinary Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}